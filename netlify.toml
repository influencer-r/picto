# Netlify Deployment Configuration for C++ to PictoBlox Converter
# Enables automated CI test execution and static asset publishing

[build]
  # Directory containing the deploy-ready files (root directory)
  publish = "."
  # Run automated AST & conversion test suite during Netlify CI build
  command = "node test/run-tests.js"

[build.environment]
  NODE_VERSION = "20"

# Security & Performance Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache Optimization for JavaScript Modules
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# Cache Optimization for Styles
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# Redirect rules (SPA fallback if needed)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
